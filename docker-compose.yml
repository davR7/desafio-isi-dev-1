name: passe

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: postgresdb
    networks:
      - passe-network
    restart: always
    environment:
      POSTGRES_PASSWORD: 12345
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    image: passe-backend-image
    container_name: passe-backend
    networks:
      - passe-network
    ports:
      - 8080:8080
    env_file:
      - ./backend/.env
    depends_on:
      postgresdb:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: passe-frontend-image
    container_name: passe-frontend
    volumes:
      - passe-frontend-volume:/var/www/html
    depends_on:
      - backend
  nginx:
    build: ./nginx
    image: passe-nginx-image
    container_name: passe-nginx
    networks:
      - passe-network
    ports:
      - 80:80
    volumes:
      - passe-frontend-volume:/var/www/html
    depends_on:
      - postgresdb
      - backend
      - frontend

volumes:
  passe-frontend-volume:

networks:
  passe-network: